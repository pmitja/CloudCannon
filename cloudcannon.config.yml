# CloudCannon configuration for the LTSE Astro demo.
# Docs: https://cloudcannon.com/documentation/developer-reference/configuration-file/

paths:
  static: public
  uploads: public/uploads

collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: wysiwyg
    url: /[slug]/
    glob:
      - '**/*.md'
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/page.md
        name: Page (block builder)
        icon: view_quilt
    add_options:
      - name: New page
        schema: default
        icon: note_add

  news:
    path: src/content/news
    name: News & Insights
    icon: newspaper
    url: /news/[slug]/
    glob:
      - '**/*.md'
    sort:
      key: date
      order: desc
    sort_options:
      - key: date
        order: desc
        label: Newest first
      - key: title
        label: Title (A-Z)
    _enabled_editors:
      - content
      - visual
      - data
    _inputs:
      # Articles need a real category ("All" only makes sense for the Latest news section)
      category:
        type: select
        options:
          values:
            - id: press-release
              name: Press release
            - id: in-the-news
              name: In the news
            - id: research
              name: Research
    schemas:
      default:
        path: .cloudcannon/schemas/news.md
        name: Article
        icon: article
    add_options:
      - name: New article
        schema: default
        icon: post_add
    preview:
      text:
        - key: title
      subtext:
        - template: '{category} · {source}'
      metadata:
        - icon: event
          text:
            - key: date
      image:
        - key: image

  settings:
    path: src/data
    name: Site settings
    icon: settings
    disable_add: true
    disable_file_actions: true
    _enabled_editors:
      - data

collection_groups:
  - heading: Website
    collections:
      - pages
      - news
  - heading: Global
    collections:
      - settings

# ---------------------------------------------------------------------------
# Inputs: how each field is edited. Keys apply anywhere they appear.
# ---------------------------------------------------------------------------
_inputs:
  title:
    type: text
    comment: Browser tab title and search-result title
  heading:
    type: text
  eyebrow:
    type: text
    comment: Small all-caps label above the heading
  text:
    type: textarea
  quote:
    type: textarea
  src:
    type: image
    label: Image
  alt:
    type: text
    label: Alt text
    comment: Describe the image for screen readers and SEO
  image:
    type: image
  icon:
    type: image
  url:
    type: url
  video:
    type: object
    comment: Paste a Vimeo or YouTube link
  background:
    type: select
    options:
      values:
        - green
        - yellow
        - grey
        - white
  seo:
    type: object
    label: SEO
    options:
      preview:
        icon: travel_explore
  description:
    type: textarea
    comment: Shown in Google results (~155 characters)
    options:
      max_length: 170
  no_index:
    type: switch
    label: Hide from search engines
  content_blocks:
    type: array
    label: Page sections
    options:
      structures: _structures.content_blocks
  provider:
    type: select
    label: Analytics provider
    options:
      values:
        - id: none
          name: None
        - id: plausible
          name: Plausible
        - id: ga4
          name: Google Analytics 4
        - id: gtm
          name: Google Tag Manager
  id:
    type: text
    label: Measurement / container ID or domain
  date:
    type: date
    comment: Publish date, used to sort articles
    instance_value: NOW
  category:
    type: select
    comment: Which filter the article appears under on /insights/
    options:
      values:
        - id: all
          name: All categories
        - id: press-release
          name: Press release
        - id: in-the-news
          name: In the news
        - id: research
          name: Research
  source:
    type: text
    comment: e.g. Press Release, The Wall Street Journal, Bloomberg Intelligence
  author:
    type: text
  excerpt:
    type: textarea
    comment: Short summary for cards and Google (1–2 sentences)
  external_url:
    type: url
    label: Original article link
    comment: Optional. Shows a "Read the full story" button
  count:
    type: number
    label: Number of articles
    options:
      min: 1
      max: 9
  platform:
    type: select
    options:
      values:
        - linkedin
        - bluesky
        - youtube
        - x

