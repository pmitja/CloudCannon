# CloudCannon configuration for the LTSE Astro demo.
# Docs: https://cloudcannon.com/documentation/developer-reference/configuration-file/

paths:
  static: public
  uploads: public/uploads

collections_config:
  pages:
    path: src/content/pages
    name: Pages
    icon: wysiwyg
    url: /[slug]/
    glob:
      - '**/*.md'
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/page.md
        name: Page (block builder)
        icon: view_quilt
    add_options:
      - name: New page
        schema: default
        icon: note_add

  settings:
    path: src/data
    name: Site settings
    icon: settings
    disable_add: true
    disable_file_actions: true
    _enabled_editors:
      - data

collection_groups:
  - heading: Website
    collections:
      - pages
  - heading: Global
    collections:
      - settings

# ---------------------------------------------------------------------------
# Inputs: how each field is edited. Keys apply anywhere they appear.
# ---------------------------------------------------------------------------
_inputs:
  title:
    type: text
    comment: Browser tab title and search-result title
  heading:
    type: text
  eyebrow:
    type: text
    comment: Small all-caps label above the heading
  text:
    type: textarea
  quote:
    type: textarea
  src:
    type: image
    label: Image
  alt:
    type: text
    label: Alt text
    comment: Describe the image for screen readers and SEO
  image:
    type: image
  icon:
    type: image
  url:
    type: url
  video:
    type: object
    comment: Paste a Vimeo or YouTube link
  background:
    type: select
    options:
      values:
        - green
        - yellow
        - grey
        - white
  seo:
    type: object
    label: SEO
    options:
      preview:
        icon: travel_explore
  description:
    type: textarea
    comment: Shown in Google results (~155 characters)
    options:
      max_length: 170
  no_index:
    type: switch
    label: Hide from search engines
  content_blocks:
    type: array
    label: Page sections
    options:
      structures: _structures.content_blocks
  provider:
    type: select
    label: Analytics provider
    options:
      values:
        - id: none
          name: None
        - id: plausible
          name: Plausible
        - id: ga4
          name: Google Analytics 4
        - id: gtm
          name: Google Tag Manager
  id:
    type: text
    label: Measurement / container ID or domain
  platform:
    type: select
    options:
      values:
        - linkedin
        - bluesky
        - youtube
        - x

